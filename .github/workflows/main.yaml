# GitHub Actions workflow for automated Docker build and Railway deployment
name: Build and Deploy to Railway

# Trigger: Run this workflow when code is pushed to the main branch
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    # Use the latest Ubuntu runner provided by GitHub
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Clone the repository code to the runner
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0 # ensures .git folder exists
      
      # Step 2: Set up Docker Buildx for advanced Docker build capabilities
      # Buildx enables features like multi-platform builds and caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Step 3: Build the Docker image from the Dockerfile
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .  # Build context is the current directory
          file: ./Dockerfile  # Path to the Dockerfile
          push: false  # Don't push to a registry (Railway will build it)
          tags: my-app:latest  # Tag the image for local reference
          load: true  # Load the image into Docker daemon
          cache-from: type=gha  # Use GitHub Actions cache for faster builds
          cache-to: type=gha,mode=max  # Save build cache for future runs
      
      # Step 4: Install Railway CLI to interact with Railway platform
      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli@latest
          railway --version  # Debug: confirm version


      # Step 5: Deploy the application to Railway
      - name: Deploy to Railway
        env:
          # Use Railway token stored in GitHub repository secrets
          # RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROJECT2 }}
          # RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          # RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_PROJECT2_SERVICE_ID }}
          # RAILWAY_SERVICE_ID: d8e79597-637b-4156-9d82-34b18cb8aa10

          # RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROJECT2 }}
          # RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_PROJECT2_SERVICE_ID }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}


        run: |
          # for debug - disable in production
          # echo "Token: $RAILWAY_TOKEN"
          # echo "Project ID: $RAILWAY_PROJECT_ID"
          # echo "Service ID: $RAILWAY_SERVICE_ID"

          # Authenticate with Railway using the API token
          # railway login --token $RAILWAY_TOKEN

          # Authenticate using token via environment variable
          # export RAILWAY_TOKEN=$RAILWAY_TOKEN
          
          # Added this line to confirm authentication - dropped as this requires 'railway login'
          # railway whoami
          
          # Link this deployment to your specific Railway project
          # railway link --project ${{ secrets.RAILWAY_PROJECT_ID }}
          # railway link --project_id $RAILWAY_PROJECT_ID
          # railway link $RAILWAY_PROJECT_ID
          
          # Deploy the application (Railway will use the Dockerfile)
          # --detach flag runs the deployment without blocking
          # railway up --service $RAILWAY_SERVICE_ID --project $RAILWAY_PROJECT_ID --detach
          # railway up --service $RAILWAY_SERVICE_ID --ci --detach
          # railway up --service $RAILWAY_SERVICE_ID
          # railway up --service=${{ env.RAILWAY_SERVICE_ID }}

          railway link --service=$RAILWAY_SERVICE_ID --project-id=$RAILWAY_PROJECT_ID --environment=$RAILWAY_ENVIRONMENT_ID
          railway redeploy --yes